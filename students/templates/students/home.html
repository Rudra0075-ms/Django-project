{% extends 'students/base.html' %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="container">

  <div class="dashboard-hero">
    <h2>Welcome back 👋</h2>
    <p class="subtitle">Here's an overview of your Student Management System</p>
  </div>

  <div class="stats-grid">
    <div class="student-card">
      <div class="card-icon">🎓</div>
      <h3>Total Students</h3>
      <h1>{{ total_students }}</h1>
    </div>
  </div>

  <div class="action-row">
    <a href="{% url 'student_list' %}" class="add-btn btn-secondary">View Students</a>
    <a href="{% url 'add_student' %}" class="add-btn btn-primary">+ Add Student</a>
  </div>

</div>
{% endblock %}
