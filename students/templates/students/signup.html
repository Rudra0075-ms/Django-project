{% extends 'students/base.html' %}

{% block title %}
Sign Up
{% endblock %}

{% block content %}

<h2>Sign Up</h2>

<form method="POST">

    {% csrf_token %}

    <label>Username:</label>
    <input type="text" name="username" required>

    <br><br>

    <label>Password:</label>
    <input type="password" name="password" required>

    <br><br>

    <button type="submit">Create Account</button>

</form>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

{% endblock %}
